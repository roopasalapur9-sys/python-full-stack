<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Management Dashboard</title>
    <link rel="stylesheet" href="Doctype.css">
</head>
<body>

<div class="container">
    <h2>Employee Management Dashboard</h2>

    <!-- Employee Form -->
    <form id="employeeForm">
        <input type="text" id="empId" placeholder="Employee ID">
        <input type="text" id="name" placeholder="Employee Name">
        <input type="text" id="department" placeholder="Department">
        <input type="email" id="email" placeholder="Email">
        <input type="text" id="salary" placeholder="Salary">
        <button type="submit">Add Employee</button>
    </form>

    <!-- Employee Table -->
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Emp ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Email</th>
                <th>Salary</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="employeeTable">
        </tbody>
    </table>
</div>

<script src="script1.js"></script>
</body>
</html>
